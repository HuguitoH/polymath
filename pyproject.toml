[project]
name = "polymath"
version = "0.1.0"
description = "Self-hosted personal AI companion: event memory, a verified morning brief and local speech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "kokoro>=0.9.4",
    "litellm>=1.98.0",
    "pgvector>=0.5.0",
    "piper-tts>=1.7.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
polymath-brief = "polymath.cli:brief"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]


[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]


[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[[tool.mypy.overrides]]
module = ["feedparser", "soundfile", "kokoro"]
ignore_missing_imports = true
