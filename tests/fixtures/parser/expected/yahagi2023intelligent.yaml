# Expected parser output: what a reader sees in the PDF, not what extraction produced.
# Titles are compared without leading numbering, case-insensitively, whitespace collapsed.
# Pages are PDF pages (1-based).
file: "Yahagi and Suzuki - 2023 - Intelligent PI control based on the ultra-local model and Kalman filter for vehicle yaw-rate control.pdf"
publisher: taylor-francis
has_outline: true           # 21 entries, 2 levels, identical to the text
page_label_offset: 0        # PDF page 1 is a publisher cover sheet; the article starts on page 2

headings:
  - {level: 1, page: 2,  title: "Introduction"}
  - {level: 1, page: 3,  title: "Problem formulation"}
  - {level: 1, page: 3,  title: "Conventional intelligent PI control scheme"}
  - {level: 2, page: 3,  title: "Basic idea"}
  - {level: 2, page: 4,  title: "In the presence of measurement noise"}
  - {level: 1, page: 5,  title: "Yaw-rate controller design based on intelligent PI control"}
  - {level: 2, page: 5,  title: "Control law"}
  - {level: 2, page: 5,  title: "Analysis of estimation performance"}
  - {level: 1, page: 6,  title: "Parameter tuning of the Kalman filter"}
  - {level: 2, page: 6,  title: "Gaussian process regression (GPR)"}
  - {level: 2, page: 6,  title: "Bayesian optimization"}
  - {level: 1, page: 7,  title: "Numerical simulation"}
  - {level: 2, page: 7,  title: "Simulation models"}
  - {level: 2, page: 7,  title: "Simulation conditions"}
  - {level: 2, page: 8,  title: "Simulation results and discussion"}
  - {level: 1, page: 10, title: "Conclusion"}
  - {level: 1, page: 10, title: "Disclosure statement"}
  - {level: 1, page: 10, title: "Notes on contributors"}
  - {level: 1, page: 10, title: "ORCID"}
  - {level: 1, page: 10, title: "References"}
  - {level: 1, page: 11, title: "Appendix"}   # the OUTLINE IS WRONG here: it says p10, the heading is on p11

statements:
  - {page: 7, label: "Remark 1"}
  - {page: 7, label: "Remark 2"}
  - {page: 7, label: "Remark 3"}

captions:
  - {page: 3,  label: "Figure 1"}
  - {page: 4,  label: "Figure 2"}
  - {page: 4,  label: "Figure 3"}
  - {page: 5,  label: "Figure 4"}
  - {page: 7,  label: "Figure 5"}
  - {page: 7,  label: "Table 1"}
  - {page: 8,  label: "Table 2"}
  - {page: 8,  label: "Table 3"}
  - {page: 8,  label: "Figure 6"}
  - {page: 8,  label: "Figure 7"}
  - {page: 8,  label: "Table 4"}
  - {page: 9,  label: "Figure 8"}
  - {page: 9,  label: "Table 5"}
  - {page: 9,  label: "Figure 9"}   # missed by diagnose.py (long caption line)
  - {page: 10, label: "Table 6"}

# Chunking: each passage must appear whole in exactly one chunk of its section.
# "mea-surement" is a line-break hyphen (removed); "yaw-rate" is a real one (kept).
passages:
  - page: 10
    section: ["Conclusion"]
    text: "which eliminates the influence of measurement noise and hence realized the desired vehicle yaw-rate control"
never_in_chunks: []
