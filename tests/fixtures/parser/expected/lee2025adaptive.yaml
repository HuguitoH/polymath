# Expected parser output: what a reader sees in the PDF, not what extraction produced.
# Titles are compared without leading numbering, case-insensitively, whitespace collapsed.
# Pages are PDF pages (1-based).
file: "Lee and Oh - 2025 - An Adaptive PID Controller for Longitudinal Velocity and Yaw Rate Tracking of Autonomous Mobility Ba.pdf"
publisher: mdpi
has_outline: true           # 11 entries, 2 levels
page_label_offset: 0

headings:
  - {level: 1, page: 1,  title: "Introduction"}
  - {level: 1, page: 6,  title: "Adaptive PID Controller Based on RLS with Multiple Constraints"}
  - {level: 2, page: 6,  title: "Adaptive PID Controller Design with Gain-Self Tuning"}
  - {level: 2, page: 8,  title: "Multiple Constraints"}
  - {level: 2, page: 10, title: "Stability Analysis with Persistency of Excitation"}
  - {level: 1, page: 11, title: "Performance Evaluation"}
  - {level: 2, page: 13, title: "Yaw Rate Tracking Results"}
  - {level: 2, page: 17, title: "Longitudinal Velocity Tracking Results"}
  - {level: 2, page: 21, title: "Yaw Rate Tracking Results with Disturbance and Noise"}
  - {level: 1, page: 22, title: "Conclusions"}
  - {level: 1, page: 23, title: "Abbreviations"}      # in the text but NOT in the outline: the outline is incomplete too
  - {level: 1, page: 23, title: "References"}

statements:
